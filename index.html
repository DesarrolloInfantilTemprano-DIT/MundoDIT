<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIT | Quantum Drag Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --glow-cyan: #00f2fe;
            --glow-pink: #ff007f;
            --bg-dark: #05070a;
            --glass: rgba(10, 15, 25, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: white;
        }

        /* --- BARRA SUPERIOR DINÁMICA --- */
        .top-nav {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 30px;
            z-index: 100;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: fit-content;
        }

        .logo-circle {
            width: 40px;
            height: 40px;
            border: 2px solid var(--glow-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--glow-cyan);
        }

        /* --- CONTENEDOR DE BOTONES DESLIZABLES --- */
        #sortable-nodes {
            display: flex;
            gap: 12px;
            flex: 1;
            padding: 5px;
        }

        .node-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: grab; /* Indica que se puede mover */
            transition: all 0.3s ease;
            user-select: none;
            white-space: nowrap;
        }

        .node-btn:active { cursor: grabbing; }

        /* Estilo al arrastrar */
        .sortable-ghost {
            opacity: 0.4;
            transform: scale(0.95);
            background: var(--glow-cyan);
        }

        .node-btn i {
            font-size: 1.1rem;
            color: var(--glow-cyan);
            text-shadow: 0 0 8px var(--glow-cyan);
        }

        .node-btn span {
            font-size: 0.75rem;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Botón seleccionado/activo */
        .node-btn.active {
            border-color: var(--glow-pink);
            background: rgba(255, 0, 127, 0.1);
        }
        .node-btn.active i {
            color: var(--glow-pink);
            text-shadow: 0 0 10px var(--glow-pink);
        }

        /* --- ÁREA DE CONTENIDO --- */
        .main-viewport {
            flex: 1;
            padding: 15px;
            background: radial-gradient(circle at center, #10141d 0%, #05070a 100%);
            position: relative;
        }

        .iframe-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 1;
            transition: opacity 0.5s;
        }

        /* Indicador visual de ordenamiento */
        .drag-handle {
            margin-right: 5px;
            color: #333;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="brand-header">
            <div class="logo-circle"><i class="fas fa-gear"></i></div>
            <div>
                <h4 style="color: var(--glow-cyan); font-size: 0.9rem;">SISTEMA DIT</h4>
                <p style="font-size: 0.5rem; color: #555;">v5.0 QUANTUM</p>
            </div>
        </div>

        <div id="sortable-nodes">
            <div class="node-btn active" data-url="https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/">
                <i class="fas fa-fingerprint"></i>
                <span>CENSO DIT</span>
            </div>
            <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/casita/">
                <i class="fas fa-brain"></i>
                <span>LA CASITA</span>
            </div>
            <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/Reservar.CITAS.DIT/">
                <i class="fas fa-microchip"></i>
                <span>CITAS DIT</span>
            </div>
            <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/Mapa/">
                <i class="fas fa-satellite-dish"></i>
                <span>MAPA DIT</span>
            </div>
            <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/RegistroDiario/">
                <i class="fas fa-code-branch"></i>
                <span>REGISTROS</span>
            </div>
            <div class="node-btn" data-url="https://confianzaseguridad772-max.github.io/Dosificador_Hierro/">
                <i class="fas fa-flask-vial"></i>
                <span>DOSIFICADOR</span>
            </div>
        </div>
    </header>

    <main class="main-viewport">
        <div class="iframe-wrapper">
            <iframe id="content-frame" src="https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/"></iframe>
        </div>
    </main>

    <script>
        // Inicializar el arrastre de botones
        const el = document.getElementById('sortable-nodes');
        Sortable.create(el, {
            animation: 350,
            ghostClass: 'sortable-ghost',
            onEnd: function() {
                console.log("Nuevo orden guardado localmente");
                // Aquí podrías guardar el orden en localStorage si quisieras
            }
        });

        // Manejar el cambio de página al hacer clic
        const buttons = document.querySelectorAll('.node-btn');
        const frame = document.getElementById('content-frame');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                // UI de botón activo
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Cambiar URL
                frame.style.opacity = '0';
                setTimeout(() => {
                    frame.src = btn.getAttribute('data-url');
                    frame.style.opacity = '1';
                }, 300);
            });
        });
    </script>
</body>
</html>
