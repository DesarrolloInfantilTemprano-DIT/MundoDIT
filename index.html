<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIT | Quantum Mobile Optimized</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --glow-cyan: #00f2fe;
            --glow-pink: #ff007f;
            --bg-dark: #05070a;
            --glass: rgba(10, 15, 25, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: white;
        }

        /* --- BARRA SUPERIOR OPTIMIZADA PARA MÓVIL --- */
        .top-nav {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            display: flex;
            flex-direction: column;
            z-index: 100;
            padding-top: 10px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            padding: 0 15px 10px 15px;
            gap: 10px;
        }

        .logo-circle {
            width: 32px;
            height: 32px;
            border: 1.5px solid var(--glow-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        /* --- CONTENEDOR CON SCROLL HORIZONTAL --- */
        .scroll-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 5px 10px 15px 10px;
            scrollbar-width: none; /* Firefox */
        }

        .scroll-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        #sortable-nodes {
            display: flex;
            gap: 10px;
            width: max-content; /* Permite que el ancho crezca con los botones */
        }

        .node-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            touch-action: pan-x; /* Permite scroll horizontal sin disparar drag */
        }

        .node-btn i {
            font-size: 1rem;
            color: var(--glow-cyan);
        }

        .node-btn span {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Estado Activo */
        .node-btn.active {
            border-color: var(--glow-pink);
            background: rgba(255, 0, 127, 0.15);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .node-btn.active i {
            color: var(--glow-pink);
        }

        /* Estilo al Arrastrar (Drag) */
        .sortable-ghost {
            opacity: 0.3;
            background: var(--glow-cyan) !important;
        }

        /* --- ÁREA DE CONTENIDO --- */
        .main-viewport {
            flex: 1;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loader para feedback visual en móvil */
        .loading-bar {
            position: absolute;
            top: 0; left: 0; height: 2px;
            width: 0%;
            background: var(--glow-cyan);
            z-index: 10;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="brand-header">
            <div class="logo-circle"><i class="fas fa-gear" style="font-size: 14px;"></i></div>
            <div>
                <h4 style="color: var(--glow-cyan); font-size: 0.8rem; line-height: 1;">SISTEMA DIT</h4>
                <p style="font-size: 0.5rem; color: #666;">v5.0 QUANTUM</p>
            </div>
        </div>

        <div class="scroll-container">
            <div id="sortable-nodes">
                <div class="node-btn active" data-url="https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/">
                    <i class="fas fa-fingerprint"></i>
                    <span>CENSO DIT</span>
                </div>
                <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/casita/">
                    <i class="fas fa-brain"></i>
                    <span>LA CASITA</span>
                </div>
                <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/Reservar.CITAS.DIT/">
                    <i class="fas fa-microchip"></i>
                    <span>CITAS DIT</span>
                </div>
                <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/Mapa/">
                    <i class="fas fa-satellite-dish"></i>
                    <span>MAPA DIT</span>
                </div>
                <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/RegistroDiario/">
                    <i class="fas fa-code-branch"></i>
                    <span>REGISTROS</span>
                </div>
                <div class="node-btn" data-url="https://confianzaseguridad772-max.github.io/Dosificador_Hierro/">
                    <i class="fas fa-flask-vial"></i>
                    <span>DOSIFICADOR</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-viewport">
        <div id="l-bar" class="loading-bar"></div>
        <iframe id="content-frame" src="https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/"></iframe>
    </main>

    <script>
        const el = document.getElementById('sortable-nodes');
        const frame = document.getElementById('content-frame');
        const lBar = document.getElementById('l-bar');

        // Configuración de Sortable optimizada para móvil
        Sortable.create(el, {
            animation: 150,
            delay: 200, // IMPORTANTE: Requiere mantener presionado 200ms para mover. 
            delayOnTouchOnly: true, // El clic normal (toque rápido) funciona para seleccionar.
            touchStartThreshold: 5, 
            ghostClass: 'sortable-ghost',
            onEnd: function() {
                // El orden se mantiene tras soltar
            }
        });

        // Evento de selección de página
        document.querySelectorAll('.node-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Feedback visual de carga
                lBar.style.width = '100%';
                
                // Cambiar estado activo
                document.querySelectorAll('.node-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Cambiar URL del iframe
                frame.src = this.getAttribute('data-url');
                
                // Reiniciar barra después de un momento
                setTimeout(() => { lBar.style.width = '0%'; }, 500);
            });
        });
    </script>
</body>
</html>
