<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIT | SIHCE Castillo Grande</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --glow-cyan: #00f2fe; --glow-pink: #ff007f; --bg-dark: #05070a; --glass: rgba(10, 15, 25, 0.95); --minsa-blue: #4477c7; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: white; }

        /* ACCESO PROFESIONAL */
        #auth-screen { position: fixed; inset: 0; z-index: 2000; display: flex; background: #fff; transition: 0.8s cubic-bezier(0.86, 0, 0.07, 1); }
        .auth-visual { flex: 1; background: linear-gradient(rgba(68,119,199,0.85), rgba(68,119,199,0.85)), url('https://w.wallhaven.cc/full/kx/wallhaven-kxjjjm.jpg'); background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 40px; color: white; }
        .auth-form-panel { width: 450px; padding: 35px; display: flex; flex-direction: column; justify-content: center; background: #fff; color: #333; box-shadow: -5px 0 20px rgba(0,0,0,0.1); overflow-y: auto; }
        .form-box { display: none; animation: fadeIn 0.4s; }
        .form-box.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        
        label { display: block; font-size: 0.7rem; font-weight: bold; color: #666; margin-bottom: 4px; margin-left: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #f1f4f7; border: 1px solid #cfd7df; border-radius: 8px; outline: none; margin-bottom: 15px; color: #333; font-size: 0.9rem; }
        .btn-main { width: 100%; padding: 14px; background: var(--minsa-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main:active { transform: scale(0.98); }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 0.8rem; color: #666; }
        .toggle-link span { color: var(--minsa-blue); cursor: pointer; font-weight: bold; text-decoration: underline; }

        /* APP PRINCIPAL */
        #main-app { display: none; flex-direction: column; height: 100vh; width: 100%; }
        .top-nav { background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 242, 254, 0.2); padding-top: 10px; }
        .brand-header { display: flex; justify-content: space-between; align-items: center; padding: 0 15px 10px; }
        .logo-circle { width: 34px; height: 34px; border: 2px solid var(--glow-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px var(--glow-cyan); }
        
        .scroll-container { width: 100%; overflow-x: auto; padding: 5px 10px 15px; scrollbar-width: none; }
        #sortable-nodes { display: flex; gap: 10px; width: max-content; }
        .node-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 25px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
        .node-btn i { font-size: 1.1rem; color: var(--glow-cyan); }
        .node-btn span { font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
        .node-btn.active { border-color: var(--glow-pink); background: rgba(255, 0, 127, 0.15); box-shadow: 0 0 12px rgba(255, 0, 127, 0.3); }

        .main-viewport { flex: 1; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* MODAL LLAVE */
        #modal-pw { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-card { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; color: #333; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-visual">
            <div><h1 style="font-size:2.5rem">SIHCE <b>DIT</b></h1><p>Versión 5.0 Quantum - Castillo Grande</p></div>
        </div>
        <div class="auth-form-panel">
            <div id="login-box" class="form-box active">
                <h2 style="margin-bottom:20px">Acceso Profesional</h2>
                <label>DNI del Usuario</label>
                <input type="text" id="l-dni" placeholder="DNI de 8 dígitos">
                <label>Contraseña</label>
                <input type="password" id="l-pass" placeholder="Clave de sistema">
                <button class="btn-main" onclick="handleLogin()">INGRESAR AL SISTEMA</button>
                <div class="toggle-link">¿No tienes cuenta activa? <span onclick="showBox('reg-check')">Verificar DNI</span></div>
            </div>

            <div id="reg-check" class="form-box">
                <h2>Verificación de Padrón</h2>
                <p style="font-size:0.8rem; color:#888; margin-bottom:15px">Consulte su autorización en el sistema regional...</p>
                <label>Ingrese DNI</label>
                <input type="text" id="r-dni-search" placeholder="Escriba aquí su DNI">
                <button class="btn-main" onclick="checkAuthorizedDNI()">BUSCAR REGISTRO</button>
                <div class="toggle-link"><span onclick="showBox('login')">Volver al inicio</span></div>
            </div>

            <div id="reg-final" class="form-box">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
                    <h3 id="reg-greeting" style="color:var(--minsa-blue); font-size:1rem"></h3>
                    <button onclick="showBox('reg-check')" style="background:none; border:none; color:var(--minsa-blue); font-size:0.7rem; cursor:pointer; font-weight:bold;"><i class="fas fa-arrow-left"></i> REGRESAR</button>
                </div>
                
                <label>Nombres y Apellidos</label>
                <input type="text" id="r-name">
                
                <label>Profesión / Especialidad</label>
                <input type="text" id="r-prof">

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div><label>Celular</label><input type="number" id="r-cel" oninput="if(this.value.length > 9) this.value = this.value.slice(0,9);"></div>
                    <div><label>Región</label><input type="text" id="r-reg"></div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div><label>Provincia</label><input type="text" id="r-prov"></div>
                    <div><label>Distrito</label><input type="text" id="r-dist"></div>
                </div>
                
                <label>E.E.S.S.</label>
                <input type="text" id="r-eess">
                
                <label>Crear Nueva Contraseña</label>
                <input type="password" id="r-new-pass" placeholder="Defina su clave">
                
                <button class="btn-main" style="background:#28a745" onclick="activateAccount()">CONFIRMAR Y ACTIVAR</button>
            </div>
            
            <div id="auth-msg" style="margin-top:20px; text-align:center; font-size:0.85rem; display:none; padding:10px; border-radius:5px"></div>
        </div>
    </div>

    <div id="main-app">
        <header class="top-nav">
            <div class="brand-header">
                <div style="display:flex; align-items:center; gap:10px">
                    <div class="logo-circle"><i class="fas fa-dna" style="color:var(--glow-cyan)"></i></div>
                    <div>
                        <h4 style="color:var(--glow-cyan); font-size:0.8rem">SISTEMA DIT</h4>
                        <p id="user-display" style="font-size:0.6rem; color:#fff; font-weight:bold"></p>
                    </div>
                </div>
                <div style="display:flex; gap:8px">
                    <button onclick="document.getElementById('modal-pw').style.display='flex'" style="background:rgba(255,255,255,0.05); border:1px solid #444; color:#fff; font-size:0.65rem; padding:6px 12px; border-radius:8px; cursor:pointer"><i class="fas fa-key"></i> LLAVE</button>
                    <button onclick="logout()" style="background:rgba(255,77,77,0.1); border:1px solid #ff4d4d; color:#ff4d4d; font-size:0.65rem; padding:6px 12px; border-radius:8px; cursor:pointer">SALIR</button>
                </div>
            </div>
            <div class="scroll-container">
                <div id="sortable-nodes">
                    <div class="node-btn active" data-url="https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/"><i class="fas fa-fingerprint"></i><span>CENSO DIT</span></div>
                    <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/casita/"><i class="fas fa-brain"></i><span>LA CASITA</span></div>
                    <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/Reservar.CITAS.DIT/"><i class="fas fa-microchip"></i><span>CITAS DIT</span></div>
                    <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/Mapa/"><i class="fas fa-satellite-dish"></i><span>MAPA DIT</span></div>
                    <div class="node-btn" data-url="https://desarrolloinfantiltemprano-dit.github.io/RegistroDiario/"><i class="fas fa-code-branch"></i><span>REGISTROS</span></div>
                    <div class="node-btn" data-url="https://confianzaseguridad772-max.github.io/Dosificador_Hierro/"><i class="fas fa-flask-vial"></i><span>DOSIFICADOR</span></div>
                </div>
            </div>
        </header>
        <main class="main-viewport">
            <iframe id="content-frame" src="https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/"></iframe>
        </main>
    </div>

    <div id="modal-pw">
        <div class="modal-card">
            <h3 style="margin-bottom:15px">Cambiar Contraseña</h3>
            <label>Contraseña Actual</label><input type="password" id="old-pw">
            <label>Nueva Contraseña</label><input type="password" id="new-pw">
            <button class="btn-main" onclick="changePassword()">ACTUALIZAR LLAVE</button>
            <button class="btn-main" style="background:#eee; color:#333; margin-top:8px" onclick="document.getElementById('modal-pw').style.display='none'">CANCELAR</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwX1dcU8tLuQIP_dYYkLQx1-MUf6KNCr-LzryKyGjuumwATF_ukGPgVmwC9wZ_9LvZg/exec";
        let currentDNI = '';
        let userDataCache = {};

        function showBox(box) { 
            document.querySelectorAll('.form-box').forEach(b => b.classList.remove('active')); 
            document.getElementById(box === 'login' ? 'login-box' : box).classList.add('active'); 
        }

        function showMsg(t, c) { 
            const m = document.getElementById('auth-msg'); 
            m.innerText = t; m.style.background = c === 'red' ? '#ffebee' : '#e3f2fd';
            m.style.color = c; m.style.display = 'block'; 
        }

        async function checkAuthorizedDNI() {
            const dni = document.getElementById('r-dni-search').value;
            if(!dni) return showMsg("Por favor, ingrese un DNI", "red");
            showMsg("Verificando credenciales...", "blue");
            
            const r = await fetch(`${SCRIPT_URL}?action=fetchUserData&dni=${dni}`);
            const res = await r.json();
            
            if(res.status === "found") {
                if(res.hasPass) { 
                    showMsg("Este usuario ya está activo. Por favor inicie sesión.", "orange"); 
                    setTimeout(()=>showBox('login'), 2000); 
                } else {
                    currentDNI = dni;
                    userDataCache = res.userData;
                    document.getElementById('reg-greeting').innerText = "Bienvenido, " + res.userData.nombre;
                    document.getElementById('r-name').value = res.userData.nombre || "";
                    document.getElementById('r-prof').value = res.userData.profesion || "";
                    document.getElementById('r-cel').value = res.userData.celular || "";
                    document.getElementById('r-reg').value = res.userData.region || "";
                    document.getElementById('r-prov').value = res.userData.provincia || "";
                    document.getElementById('r-dist').value = res.userData.distrito || "";
                    document.getElementById('r-eess').value = res.userData.eess || "";
                    showBox('reg-final');
                    showMsg("", "");
                }
            } else { showMsg("DNI no autorizado en el sistema DIT.", "red"); }
        }

        async function activateAccount() {
            const cel = document.getElementById('r-cel').value;
            const pass = document.getElementById('r-new-pass').value;

            if(cel.length !== 9) return showMsg("El celular debe tener 9 dígitos", "red");
            if(pass.length < 4) return showMsg("Ingrese una contraseña válida", "red");

            const data = { 
                action: "updateUserProfile", 
                dni: currentDNI, 
                nombre: document.getElementById('r-name').value, 
                profesion: document.getElementById('r-prof').value, 
                celular: cel, 
                region: document.getElementById('r-reg').value,
                provincia: document.getElementById('r-prov').value,
                distrito: document.getElementById('r-dist').value,
                eess: document.getElementById('r-eess').value, 
                newPass: pass 
            };

            showMsg("Activando perfil...", "blue");
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            showMsg("¡Cuenta activada con éxito!", "green");
            setTimeout(()=>location.reload(), 1500);
        }

        async function handleLogin() {
            const u = document.getElementById('l-dni').value;
            const p = document.getElementById('l-pass').value;
            showMsg("Validando acceso...", "blue");
            const r = await fetch(`${SCRIPT_URL}?action=login&dni=${u}&pass=${p}`);
            const res = await r.json();
            if(res.status === "success") {
                sessionStorage.setItem('user_dni', u);
                sessionStorage.setItem('is_auth', 'true');
                sessionStorage.setItem('user_name', res.nombre);
                unlockApp(res.nombre);
            } else { showMsg("DNI o contraseña incorrectos", "red"); }
        }

        async function changePassword() {
            const oldP = document.getElementById('old-pw').value;
            const newP = document.getElementById('new-pw').value;
            if(!oldP || !newP) return alert("Complete los campos");

            const data = { 
                action: "updateUserProfile", 
                dni: sessionStorage.getItem('user_dni'), 
                oldPass: oldP, 
                newPass: newP, 
                isChange: true,
                // Mantenemos los datos actuales al cambiar clave
                nombre: sessionStorage.getItem('user_name'),
                profesion: "", celular: "", region: "", provincia: "", distrito: "", eess: ""
            };

            alert("Procesando cambio...");
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            document.getElementById('modal-pw').style.display='none';
            alert("Operación completada");
        }

        function unlockApp(n) {
            document.getElementById('auth-screen').style.transform = "translateY(-100%)";
            document.getElementById('main-app').style.display = "flex";
            document.getElementById('user-display').innerText = n;
            const msg = new SpeechSynthesisUtterance(`Bienvenido al sistema DIT, ${n}`);
            msg.lang = 'es-ES'; window.speechSynthesis.speak(msg);
        }

        function logout() { sessionStorage.clear(); location.reload(); }
        if(sessionStorage.getItem('is_auth') === 'true') unlockApp(sessionStorage.getItem('user_name'));

        Sortable.create(document.getElementById('sortable-nodes'), { animation: 150 });
        document.querySelectorAll('.node-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.node-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('content-frame').src = this.getAttribute('data-url');
            });
        });
    </script>
</body>
</html>
