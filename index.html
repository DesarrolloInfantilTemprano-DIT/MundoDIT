<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIT CORE - Multiverso de Desarrollo Infantil</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-pink: #f093fb;
            --sidebar-w: 280px;
            --sidebar-c: 90px;
            --bg-deep: #0b0e14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1a1f2c, #0b0e14);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* FONDO DINÁMICO "CON VIDA" */
        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: var(--accent-blue);
            filter: blur(150px);
            opacity: 0.12;
            border-radius: 50%;
            z-index: -1;
            animation: drift 25s infinite alternate;
        }

        @keyframes drift {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(120%, 80%); }
        }

        /* --- SIDEBAR RETRÁCTIL TIPO 5D --- */
        #sidebar {
            width: var(--sidebar-w);
            height: 96vh;
            margin: 2vh 0 2vh 20px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            position: relative;
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        #sidebar.collapsed {
            width: var(--sidebar-c);
        }

        /* Botón de control lateral */
        .toggle-zone {
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 70px;
            background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-blue));
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            border: 3px solid #0b0e14;
            transition: 0.3s;
        }

        .toggle-zone:hover { transform: translateY(-50%) scale(1.1); }

        /* Logo y Título */
        .logo-area {
            padding: 45px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            overflow: hidden;
        }

        .logo-box {
            min-width: 45px;
            height: 45px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.3rem;
            white-space: nowrap;
            background: linear-gradient(to right, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Navegación */
        .nav-links {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            text-decoration: none;
            color: #94a3b8;
            border-radius: 20px;
            transition: all 0.4s;
            cursor: pointer;
            position: relative;
        }

        .nav-item i {
            font-size: 1.4rem;
            min-width: 40px;
            transition: 0.3s;
        }

        .nav-item span {
            font-weight: 600;
            white-space: nowrap;
            transition: 0.5s;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            transform: translateX(8px) scale(1.02);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.15), transparent);
            color: var(--accent-cyan);
            border-left: 4px solid var(--accent-cyan);
        }

        .collapsed .logo-text, .collapsed .nav-item span {
            opacity: 0;
            pointer-events: none;
        }

        /* --- ÁREA DE CONTENIDO (VIEWPORT) --- */
        .viewport {
            flex: 1;
            height: 100vh;
            padding: 2vh 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-bar {
            height: 80px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 35px;
            justify-content: space-between;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .iframe-container {
            flex: 1;
            background: #000;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            position: relative;
            box-shadow: 0 50px 100px rgba(0,0,0,0.7);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* Cargador Espacial */
        .loader {
            position: absolute;
            inset: 0;
            background: #0b0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .ring {
            width: 70px;
            height: 70px;
            border: 4px solid var(--glass-border);
            border-top: 4px solid var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <nav id="sidebar">
        <div class="toggle-zone" onclick="toggleSidebar()">
            <i class="fas fa-chevron-left" id="t-icon" style="color:#000; font-size: 0.9rem;"></i>
        </div>

        <div class="logo-area">
            <div class="logo-box"><i class="fas fa-microchip"></i></div>
            <span class="logo-text">DIT DASHBOARD</span>
        </div>

        <div class="nav-links">
            <div class="nav-item active" onclick="load('https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/', 'Monitor de Censo', this)">
                <i class="fas fa-database"></i>
                <span>Censo DIT</span>
            </div>
            <div class="nav-item" onclick="load('https://desarrolloinfantiltemprano-dit.github.io/casita/', 'Entorno Virtual Casita', this)">
                <i class="fas fa-shield-cat"></i>
                <span>La Casita</span>
            </div>
            <div class="nav-item" onclick="load('https://desarrolloinfantiltemprano-dit.github.io/Reservar.CITAS.DIT/', 'Control de Agenda', this)">
                <i class="fas fa-calendar-check"></i>
                <span>Reservar Citas</span>
            </div>
            <div class="nav-item" onclick="load('https://desarrolloinfantiltemprano-dit.github.io/Mapa/', 'Mapeo Geoespacial', this)">
                <i class="fas fa-earth-americas"></i>
                <span>Mapa DIT</span>
            </div>
            <div class="nav-item" onclick="load('https://desarrolloinfantiltemprano-dit.github.io/RegistroDiario/', 'Bitácora de Operaciones', this)">
                <i class="fas fa-terminal"></i>
                <span>Registro Diario</span>
            </div>
            <div class="nav-item" onclick="load('https://confianzaseguridad772-max.github.io/Dosificador_Hierro/', 'Algoritmo de Dosificación', this)">
                <i class="fas fa-vial-circle-check"></i>
                <span>Dosificador</span>
            </div>
        </div>
    </nav>

    <main class="viewport">
        <div class="top-bar">
            <div>
                <h2 id="view-title" style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Monitor de Censo</h2>
                <p style="font-size: 0.8rem; color: #64748b;">Protocolo de Desarrollo Infantil Temprano</p>
            </div>
            <div class="status-badge">
                <i class="fas fa-bolt"></i>
                SISTEMA EN LÍNEA
            </div>
        </div>

        <div class="iframe-container">
            <div id="loader" class="loader">
                <div class="ring"></div>
                <p style="margin-top:25px; letter-spacing: 3px; font-size: 0.7rem; color: var(--accent-cyan); font-weight: bold;">SINCRONIZANDO...</p>
            </div>
            <iframe id="frame" src="https://desarrolloinfantiltemprano-dit.github.io/CensoDIT/" onload="done()"></iframe>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('t-icon');
            sidebar.classList.toggle('collapsed');
            icon.className = sidebar.classList.contains('collapsed') ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
        }

        function load(url, title, el) {
            // Animación de botones
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            
            // Actualizar Título
            document.getElementById('view-title').innerText = title;
            
            // Cargar iFrame con efecto
            const loader = document.getElementById('loader');
            const frame = document.getElementById('frame');
            loader.style.display = 'flex';
            frame.style.opacity = '0';
            frame.src = url;
        }

        function done() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('frame').style.opacity = '1';
        }
    </script>
</body>
</html>
